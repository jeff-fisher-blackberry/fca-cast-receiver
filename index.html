<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>French Cooking Academy Cast Receiver</title>
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #131A29 0%, #0B101B 100%);
      color: #E8D5B5;
      font-family: 'Playfair Display', Georgia, serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #standby-card {
      text-align: center;
      transition: opacity 0.4s ease;
    }
    #crest-svg {
      width: 150px;
      height: 150px;
      margin-bottom: 24px;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.7));
    }
    h1 {
      font-size: 46px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin: 0 0 10px 0;
      text-shadow: 0 4px 14px rgba(0,0,0,0.8);
    }
    p {
      font-size: 17px;
      letter-spacing: 2px;
      color: rgba(232, 213, 181, 0.7);
      text-transform: uppercase;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
    }
    #player-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: none;
      background: #000;
    }
  </style>
</head>
<body>
  <div id="standby-card">
    <svg id="crest-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="46" stroke="#E8D5B5" stroke-width="2"/>
      <circle cx="50" cy="50" r="42" stroke="#E8D5B5" stroke-width="0.8" stroke-dasharray="2 2"/>
      <path d="M50 18 L55 35 L73 35 L59 46 L64 63 L50 52 L36 63 L41 46 L27 35 L45 35 Z" fill="#E8D5B5"/>
      <text x="50" y="82" text-anchor="middle" fill="#E8D5B5" font-size="12" font-family="Georgia" letter-spacing="2">FCA</text>
    </svg>
    <h1>French Cooking Academy</h1>
    <p>Ready to stream from tablet</p>
  </div>

  <div id="player-container">
    <div id="yt-player"></div>
  </div>

  <script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const CUSTOM_CHANNEL = 'urn:x-cast:com.example.frenchcookingacademy';
    let ytPlayer = null;
    let isYtReady = false;
    let isCcEnabled = false;

    function broadcastStatus() {
      if (!ytPlayer || !context) return;
      try {
        if (typeof context.resetInactivityTimeout === 'function') {
          context.resetInactivityTimeout();
        }

        const currentTime = (typeof ytPlayer.getCurrentTime === 'function') ? ytPlayer.getCurrentTime() : 0;
        const duration = (typeof ytPlayer.getDuration === 'function') ? ytPlayer.getDuration() : 0;
        const playerState = (typeof ytPlayer.getPlayerState === 'function') ? ytPlayer.getPlayerState() : -1;
        const isPlaying = (playerState === 1);

        const statusPayload = {
          action: 'STATUS_UPDATE',
          currentTime: currentTime,
          duration: duration,
          isPlaying: isPlaying,
          ccEnabled: isCcEnabled
        };

        const payloadString = JSON.stringify(statusPayload);
        const senders = (typeof context.getSenders === 'function') ? context.getSenders() : [];
        if (senders && senders.length > 0) {
          senders.forEach(sender => {
            try {
              context.sendCustomMessage(CUSTOM_CHANNEL, sender.id, payloadString);
            } catch (e) {
              console.error("sendCustomMessage error to", sender.id, e);
            }
          });
        }
      } catch (e) {
        console.error("Error broadcasting status:", e);
      }
    }

    setInterval(broadcastStatus, 1000);

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('yt-player', {
        height: '100%',
        width: '100%',
        playerVars: {
          autoplay: 1,
          controls: 0,
          rel: 0,
          cc_load_policy: 0, // Force captions OFF by default
          hl: 'en',
          origin: window.location.origin
        },
        events: {
          onReady: () => {
            isYtReady = true;
            // Start CAF v3 with a 24-hour maxInactivity window
            const receiverOptions = {
              maxInactivity: 86400, // 24 hours
              statusText: 'French Cooking Academy'
            };
            context.start(receiverOptions);
          },
          onStateChange: (event) => {
            if (event.data === YT.PlayerState.ENDED) {
              document.getElementById('player-container').style.display = 'none';
              document.getElementById('standby-card').style.display = 'block';
            }
            broadcastStatus();
          }
        }
      });
    }

    context.addCustomMessageListener(CUSTOM_CHANNEL, (customEvent) => {
      if (typeof context.resetInactivityTimeout === 'function') {
        context.resetInactivityTimeout();
      }
      let data = customEvent.data;
      if (typeof data === 'string') {
        try { data = JSON.parse(data); } catch(e) {}
      }
      if (!data) return;

      if (data.action === 'PING') {
        // Keep-alive heartbeat from sender to prevent CAF v3 idle timeout
        return;
      }
      if (data.action === 'LOAD_VIDEO') {
        document.getElementById('standby-card').style.display = 'none';
        document.getElementById('player-container').style.display = 'block';
        if (isYtReady && ytPlayer) {
          ytPlayer.loadVideoById(data.videoId, data.startSeconds || 0);
        }
      } else if (data.action === 'PLAY') {
        ytPlayer && ytPlayer.playVideo();
      } else if (data.action === 'PAUSE') {
        ytPlayer && ytPlayer.pauseVideo();
      } else if (data.action === 'SEEK') {
        ytPlayer && ytPlayer.seekTo(data.positionSeconds, true);
      } else if (data.action === 'TOGGLE_CC' || data.action === 'SET_CC') {
        isCcEnabled = (data.action === 'SET_CC') ? !!data.enabled : !isCcEnabled;
        if (ytPlayer && typeof ytPlayer.setOption === 'function') {
          try {
            if (isCcEnabled) {
              ytPlayer.setOption('captions', 'track', { languageCode: 'en' });
            } else {
              ytPlayer.setOption('captions', 'track', {});
            }
          } catch (err) {
            console.warn('Caption toggle error:', err);
          }
        }
        broadcastStatus();
      }
    });
  </script>
</body>
</html>
